<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grade Checker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="grade-card">
      <p class="eyebrow">A quick check</p>
      <h1>Grade Checker</h1>
      <p class="intro">Enter your grade to see if you passed.</p>

      <div class="checker">
        <label for="gradeInput">Your grade</label>
        <input
          type="number"
          id="gradeInput"
          class="grade-input"
          placeholder="e.g. 80"
        />
        <button class="check-button" onclick="checkGrade()">Check</button>
      </div>

      <p id="gradeResult" class="result" aria-live="polite"></p>
      <p class="passing-note">A grade of 75 or higher is a passing grade.</p>
    </main>

    <script src="script.js"></script>
  </body>
</html>
